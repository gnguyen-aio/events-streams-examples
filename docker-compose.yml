services:
  ignition:
    build:
      context: ignition #see ./ignition/Dockerfile
      args:
        - IGNITION_VERSION=${IGNITION_VERSION}
    pull_policy: build # always build the image so local changes are included
    container_name: ignition
    restart: no
    ports:
      - 8088:8088
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      # Mount gateway config and projects for version control
      - ./ignition/config:/usr/local/bin/ignition/data/config
      - ./ignition/projects:/usr/local/bin/ignition/data/projects
      # Pre-populate commissioning.json for first time gateway setup
      - ./ignition/commissioning.json:/usr/local/bin/ignition/data/commissioning.json
    environment:
      ACCEPT_IGNITION_EULA: 'Y'
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD: password
      IGNITION_EDITION: standard
      TZ: America/Denver
      IGNITION_LICENSE_KEY: ${IGNITION_LICENSE_KEY:-}
      IGNITION_ACTIVATION_TOKEN: ${IGNITION_ACTIVATION_TOKEN:-}
      ACCEPT_MODULE_LICENSES: com.cirruslink.mqtt.engine.gateway,com.cirruslink.mqtt.transmission.gateway,com.cirruslink.mqtt.distributor.gateway
      ACCEPT_MODULE_CERTS: com.cirruslink.mqtt.engine.gateway,com.cirruslink.mqtt.transmission.gateway,com.cirruslink.mqtt.distributor.gateway
    command:
      -n ignition
    networks:
      - net

  # visit at: localhost:5432
  postgres:
    container_name: postgres
    image: postgres:18
    restart: no
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin
      POSTGRES_DB: postgres
      TZ: America/Denver
    ports:
     - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d/
    networks:
      - net

  # visit at: http://localhost:5050/browser/
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.12
    restart: no
    user: root # Needed to change permissions on the pgpass file
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_SERVERS_JSON: "'/pgadmin4/servers.json'"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - ./pgadmin/pgpass:/var/lib/pgadmin/storage/pgadmin4_pgadmin.org/pgpass
    entrypoint: >
      /bin/sh -c "
      chmod 600 /var/lib/pgadmin/storage/pgadmin4_pgadmin.org/pgpass;
      chown 5050:5050 /var/lib/pgadmin/storage/pgadmin4_pgadmin.org/pgpass;
      /entrypoint.sh"
    ports:
      - "5050:80"
    networks:
      - net

# --- KAFKA BROKER ---
  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk' # Required for KRaft initialization
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data # Persists topics and messages
    networks:
      - net

  kafka-init:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka-init
    restart: no
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      cub kafka-ready -b kafka:9092 1 60
      
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic data-to-ignition --partitions 1 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic data-to-kafka --partitions 1 --replication-factor 1

      echo 'Topics created successfully.'
      "
    networks:
      - net

# visit at: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=ignition-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      - kafka
    networks:
      - net

networks:
  net:
    driver: bridge

volumes:
  ignition-data:
  postgres-data:
  pgadmin-data:
  kafka-data: